include:
  - path: docker/langfuse.compose.yml

services:
  mysql:
    image: mysql:8.4
    container_name: zamp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - zamp

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: zamp-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - zamp

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    container_name: zamp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MYSQLHOST: ${MYSQLHOST:-mysql}
      MYSQLPORT: ${MYSQLPORT:-3306}
      MYSQLUSER: ${MYSQLUSER}
      MYSQLPASSWORD: ${MYSQLPASSWORD}
      MYSQLDATABASE: ${MYSQLDATABASE}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      NVIDIA_TIMEOUT_MS: ${NVIDIA_TIMEOUT_MS:-60000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-zamp-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-zamp-local}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      LANGFUSE_UI_URL: ${LANGFUSE_UI_URL:-http://localhost:3100}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/tsconfig.json:/app/tsconfig.json:ro
      - ./apps/backend/tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./apps/backend/tsconfig.typeorm.json:/app/tsconfig.typeorm.json:ro
      - ./apps/backend/nest-cli.json:/app/nest-cli.json:ro
      - ./apps/backend/package.json:/app/package.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect({port:3000,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - zamp

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    container_name: zamp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/index.html:/app/index.html:ro
      - ./apps/frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./apps/frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./apps/frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./apps/frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
    networks:
      - zamp

networks:
  zamp:
    driver: bridge

volumes:
  mysql_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
